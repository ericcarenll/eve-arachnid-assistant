<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVE Workstation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="scene">
      <div class="wall"></div>

      <div class="window left-window">
        <div class="blind blind-1"></div>
        <div class="blind blind-2"></div>
        <div class="blind blind-3"></div>
        <div class="blind blind-4"></div>
        <div class="blind blind-5"></div>
      </div>

      <div class="window right-window">
        <div class="blind blind-1"></div>
        <div class="blind blind-2"></div>
        <div class="blind blind-3"></div>
        <div class="blind blind-4"></div>
        <div class="blind blind-5"></div>
      </div>

      <div class="desk">
        <div class="desk-top"></div>
        <div class="desk-leg left-leg"></div>
        <div class="desk-leg right-leg"></div>

        <div class="monitor monitor-left">
          <div class="monitor-bezel"></div>
          <div class="screen screen-left">
            <div class="screen-glow"></div>
          </div>
        </div>

        <div class="monitor monitor-center">
          <div class="monitor-bezel"></div>
          <div class="screen screen-center">
            <div class="screen-glow"></div>
          </div>
        </div>

        <div class="monitor monitor-right">
          <div class="monitor-bezel"></div>
          <div class="screen screen-right">
            <div class="screen-glow"></div>
          </div>
        </div>

        <div class="laptop">
          <div class="laptop-screen"></div>
          <div class="laptop-keyboard"></div>
        </div>

        <div class="desk-objects">
          <div class="speaker"></div>
          <div class="controller"></div>
          <div class="box"></div>
        </div>

        <div class="cable cable-1"></div>
        <div class="cable cable-2"></div>
        <div class="cable cable-3"></div>
      </div>

      <div class="robot-arm">
        <div class="arm-base"></div>
        <div class="arm-neck"></div>
        <div class="arm-joint j1"></div>
        <div class="arm-joint j2"></div>
        <div class="arm-joint j3"></div>
        <div class="arm-tip"></div>
      </div>

      <div class="chair"></div>

      <div class="back-panel">
        <div class="mesh"></div>
      </div>
    </div>
  </body>
</html>
