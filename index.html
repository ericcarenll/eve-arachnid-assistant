<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fabricator AI Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="scene">
      <div class="wall"></div>

      <div class="window left-window">
        <div class="blind blind-1"></div>
        <div class="blind blind-2"></div>
        <div class="blind blind-3"></div>
        <div class="blind blind-4"></div>
        <div class="blind blind-5"></div>
      </div>

      <div class="window right-window">
        <div class="blind blind-1"></div>
        <div class="blind blind-2"></div>
        <div class="blind blind-3"></div>
        <div class="blind blind-4"></div>
        <div class="blind blind-5"></div>
      </div>

      <div class="fabricator-module">
        <div class="fabricator-header">
          <span class="chip">EVE // FABRICATOR</span>
          <span class="online">online</span>
        </div>

        <div class="fabricator-viewport">
          <div class="shooter-3d">
            <div class="body">
              <div class="barrel">
                <div class="nozzle"></div>
              </div>
              <div class="chamber">
                <div class="fluid-tank">
                  <div class="fluid-liquid"></div>
                </div>
              </div>
              <div class="tank-indicator"></div>
              <div class="strap"></div>
              <div class="trigger"></div>
              <div class="grip"></div>
              <div class="casing"></div>
            </div>
          </div>
        </div>

        <div class="fabricator-panel">
          <div class="control-section">
            <div class="control-title">Fabrication Core</div>
            <div class="param">
              <span>Material</span>
              <span class="value">Aqua Silk</span>
            </div>
            <div class="param">
              <span>Flux</span>
              <span class="value">97.4%</span>
            </div>
            <div class="slider"></div>
          </div>

          <div class="control-section">
            <div class="control-title">AI Link</div>
            <div class="stat-grid">
              <div class="stat-box">
                <div>Sync</div>
                <div class="num">96%</div>
              </div>
              <div class="stat-box">
                <div>Vibe</div>
                <div class="num">4.8</div>
              </div>
            </div>
          </div>

          <div class="button-group">
            <button class="btn">Calibrate</button>
            <button class="btn">Spool</button>
            <button class="btn fire">Fabricate</button>
          </div>
        </div>
      </div>

      <div class="desk">
        <div class="desk-top"></div>
        <div class="desk-leg left-leg"></div>
        <div class="desk-leg right-leg"></div>

        <div class="monitor monitor-left">
          <div class="monitor-bezel"></div>
          <div class="screen screen-left">
            <div class="screen-glow"></div>
          </div>
        </div>

        <div class="monitor monitor-center">
          <div class="monitor-bezel"></div>
          <div class="screen screen-center">
            <div class="screen-glow"></div>
          </div>
        </div>

        <div class="monitor monitor-right">
          <div class="monitor-bezel"></div>
          <div class="screen screen-right">
            <div class="screen-glow"></div>
          </div>
        </div>

        <div class="laptop">
          <div class="laptop-screen"></div>
          <div class="laptop-keyboard"></div>
        </div>

        <div class="desk-objects">
          <div class="speaker"></div>
          <div class="controller"></div>
          <div class="box"></div>
        </div>

        <div class="cable cable-1"></div>
        <div class="cable cable-2"></div>
        <div class="cable cable-3"></div>
      </div>

      <div class="robot-arm">
        <div class="arm-base"></div>
        <div class="arm-neck"></div>
        <div class="arm-joint j1"></div>
        <div class="arm-joint j2"></div>
        <div class="arm-joint j3"></div>
        <div class="arm-tip"></div>
      </div>

      <div class="chair"></div>

      <div class="back-panel">
        <div class="mesh"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
